name: zones
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  schedule:
    # UTC. Covers the Atlanta Saturday 6 pm and Sunday 2 pm edges in both EDT and EST.
    - cron: '5 22 * * 6'
    - cron: '5 23 * * 6'
    - cron: '5 18 * * 0'
    - cron: '5 19 * * 0'
  workflow_dispatch: {}
permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write
concurrency:
  group: zones-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  zones:
    # Not named 'zones': the required check is the commit status this script posts,
    # and a job called 'zones' would pass whenever the script merely ran.
    name: zone-note
    runs-on: ubuntu-latest
    steps:
      # ALWAYS the default branch: a pull request can never change these rules for itself.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/zones/check.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
