<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- MOS app switcher (staff side only). FIRST in <head>, synchronous, before Pulse and
         GA4 below: mo-apps.core.js removes a #mos= sign-in hint from the address before any
         tracker can read it. document.write keeps it blocking; the public reader never loads it. -->
    <script>
      if (/^\/staff\/*$/.test(location.pathname)) document.write('<script src="/multiplyos/mo-apps.core.js"><\/script>');
    </script>
    <!-- MOS device lock (Face ID required, staff side only). Same contract as above: loaded
         synchronously in <head> by document.write on /staff, so data-required is read at head time.
         The congregation reader never loads it, so it has no lock, hidden page or setup sheet.
         A /staff load with no staff session (or one the lock just asked to end with "Use your
         password instead") also gets a <meta data-mo-lock-signin> BEFORE the kit runs, so the sign-in
         view is never locked, even before the lazy sign-in form renders. StaffApp removes it on sign-in. -->
    <script>
      if (/^\/staff\/*$/.test(location.pathname)) {
        var dwSignedOut = false;
        try {
          var dwStamp = Number(sessionStorage.getItem('mo-lock:signout-at'));
          dwSignedOut = !localStorage.getItem('dw_staff_token') || (dwStamp > 0 && Date.now() - dwStamp < 60000);
        } catch (e) { dwSignedOut = false; }
        if (dwSignedOut) document.write('<meta name="mo-lock-signin" data-mo-lock-signin>');
        document.write('<script src="/multiplyos/mo-lock.js" data-required="true"><\/script>');
      }
    </script>

    <!-- Analytics.
         Pulse (https://futures.church/px.js) is cookieless hit analytics and
         loads on every page view, with or without cookie consent.
         GA4 sets cookies, so it stays behind the banner: __dwLoadAnalytics
         runs only when dw_cookie_consent === 'accepted'. CookieConsent calls
         it on Accept so GA4 applies without a reload. Declining never loads GA4. -->
    <script>
      (function () {
        var GA_ID = 'G-E0CGKS9P9Q';
        // Pulse Insights — owned, cookieless analytics (futures.church/admin/pulse).
        // Unconditional: not gated on dw_cookie_consent.
        if (!window.__dwPulseLoaded) {
          window.__dwPulseLoaded = true;
          var px = document.createElement('script');
          px.defer = true;
          px.src = 'https://futures.church/px.js';
          document.head.appendChild(px);
        }
        window.__dwLoadAnalytics = function () {
          if (window.__dwAnalyticsLoaded) return;
          window.__dwAnalyticsLoaded = true;
          window.dataLayer = window.dataLayer || [];
          window.gtag = function () { window.dataLayer.push(arguments); };
          window.gtag('js', new Date());
          window.gtag('config', GA_ID, { anonymize_ip: true });
          var ga = document.createElement('script');
          ga.async = true;
          ga.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
          document.head.appendChild(ga);
        };
        try {
          if (localStorage.getItem('dw_cookie_consent') === 'accepted') {
            window.__dwLoadAnalytics();
          } else if (localStorage.getItem('dw_cookie_consent') === 'declined') {
            window['ga-disable-' + GA_ID] = true;
          }
        } catch (e) { /* storage blocked — GA4 stays off; Pulse already loaded */ }
      })();
    </script>

      <h1>Futures Daily Word</h1>

      <p>Features: Daily Bible readings, multiple reading plans, audio playback, personal notes, and more.</p>

    <script>
      // ?reset — nuke everything and reload fresh.
      // App-origin only: on futures.church/daily-word the registrations and
      // caches belong to the CHURCH (incl. the /listen PWA) — never touch them.
      (function(){
        if(location.search.indexOf('reset')===-1) return;
        var h=location.hostname;
        if(h!=='futuresdailyword.com'&&h!=='www.futuresdailyword.com'&&h!=='futures-daily-word.netlify.app'&&h!=='localhost'&&h!=='127.0.0.1') return;
        if('serviceWorker' in navigator){
          navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(s){s.unregister();});});
        }
        if('caches' in window){caches.keys().then(function(k){k.forEach(function(c){caches.delete(c);});});}
        localStorage.clear(); sessionStorage.clear();
        history.replaceState(null,'',location.pathname);
        setTimeout(function(){location.reload(true);},300);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
