    <!-- Analytics consent gate.
         GA4 and Pulse used to load unconditionally on every first visit, so a
         visitor was tracked and given _ga cookies BEFORE the consent banner was
         answered (declining only set ga-disable afterwards, too late). Nothing
         loads now until consent is 'accepted'; CookieConsent calls
         window.__dwLoadAnalytics() on Accept so it applies without a reload. -->
    <script>
      (function () {
        var GA_ID = 'G-E0CGKS9P9Q';
        window.__dwLoadAnalytics = function () {
          if (window.__dwAnalyticsLoaded) return;
          window.__dwAnalyticsLoaded = true;
          window.dataLayer = window.dataLayer || [];
          window.gtag = function () { window.dataLayer.push(arguments); };
          window.gtag('js', new Date());
          window.gtag('config', GA_ID, { anonymize_ip: true });
          var ga = document.createElement('script');
          ga.async = true;
          ga.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
          document.head.appendChild(ga);
          // Pulse Insights — owned analytics (futures.church/admin/pulse)
          var px = document.createElement('script');
          px.defer = true;
          px.src = 'https://futures.church/px.js';
          document.head.appendChild(px);
        };
        try {
          if (localStorage.getItem('dw_cookie_consent') === 'accepted') {
            window.__dwLoadAnalytics();
          } else if (localStorage.getItem('dw_cookie_consent') === 'declined') {
            window['ga-disable-' + GA_ID] = true;
          }
        } catch (e) { /* storage blocked — stay off */ }
      })();
    </script>

  <body>
    <div id="root"></div>
    <noscript>
      <h1>Futures Daily Word</h1>
      <p>Your daily Bible reading companion from Futures Church. Read, listen, and study scripture every day with guided reading plans, audio Bible, and personal notes.</p>
      <p>Features: Daily Bible readings, multiple reading plans, audio playback, personal notes, and more.</p>
      <p>Please enable JavaScript to use the Futures Daily Word app.</p>
    </noscript>
    <script>
      // ?reset — nuke everything and reload fresh.
      // App-origin only: on futures.church/daily-word the registrations and
      // caches belong to the CHURCH (incl. the /listen PWA) — never touch them.
      (function(){
        if(location.search.indexOf('reset')===-1) return;
        var h=location.hostname;
        if(h!=='futuresdailyword.com'&&h!=='www.futuresdailyword.com'&&h!=='futures-daily-word.netlify.app'&&h!=='localhost'&&h!=='127.0.0.1') return;
        if('serviceWorker' in navigator){
          navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(s){s.unregister();});});
        }
        if('caches' in window){caches.keys().then(function(k){k.forEach(function(c){caches.delete(c);});});}
        localStorage.clear(); sessionStorage.clear();
        history.replaceState(null,'',location.pathname);
        setTimeout(function(){location.reload(true);},300);
      })();
    </script>
    <script>
      // One-time cache reset — keyed by version. Clears stale app caches only,
      // preserves offline Bible (fdw-bible-v1) and font cache (fdw-fonts-v1).
      // App-origin only: un-gated this unregistered the church's /listen worker
      // and deleted church-origin caches on every version bump.
      (function(){
        var V='v63';
        var h=location.hostname;
        if(h!=='futuresdailyword.com'&&h!=='www.futuresdailyword.com'&&h!=='futures-daily-word.netlify.app'&&h!=='localhost'&&h!=='127.0.0.1') return;
        if(localStorage.getItem('fdw_nuked')===V) return;
        var KEEP=['fdw-bible-v1','fdw-fonts-v1'];
        if('serviceWorker' in navigator){
          navigator.serviceWorker.getRegistrations().then(function(regs){
            regs.forEach(function(r){r.unregister();});
          });
        }
        if('caches' in window){
          caches.keys().then(function(keys){
            keys.forEach(function(k){
              if(KEEP.indexOf(k)===-1) caches.delete(k);
            });
          });
        }
        localStorage.setItem('fdw_nuked',V);
        setTimeout(function(){location.reload(true);},500);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
